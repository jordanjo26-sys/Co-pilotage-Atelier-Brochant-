name: Déploiement OVHcloud

# Volontairement manuel (workflow_dispatch) pendant la phase de mise en
# route, en plus du declenchement automatique sur push vers "main" une fois
# la branche stabilisee et fusionnee. Un declenchement manuel permet de
# rejouer un deploiement precis (branche ou commit) a la demande.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou commit a deployer (vide = branche par defaut)"
        required: false
        default: ""
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Configurer la clé SSH de déploiement
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OVH_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.OVH_HOST }}" >> ~/.ssh/known_hosts

      - name: Préparer le serveur (MOTD, dossier applicatif)
        run: |
          # Un MOTD/banniere affiche a la connexion pollue le flux binaire de
          # rsync ("protocol version mismatch -- is your shell clean?").
          # ~/.hushlogin supprime ce message pour l'utilisateur de deploiement.
          #
          # L'utilisateur SSH (OVH_USER, ex. "ubuntu" sur les images Ubuntu
          # cloud OVH) n'est pas root : /opt/copilote-brochant est prepare et
          # confie a cet utilisateur via sudo pour que rsync (execute sans
          # sudo, car sudo casserait le flux binaire de rsync) puisse y
          # ecrire. bootstrap.sh est ensuite execute avec sudo, car il
          # installe des paquets systeme et cree un utilisateur applicatif.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}" \
            "touch ~/.hushlogin && sudo mkdir -p /opt/copilote-brochant && sudo chown -R \$(whoami):\$(whoami) /opt/copilote-brochant"

      - name: Synchroniser le code vers le serveur
        run: |
          rsync -az --delete \
            --exclude=".git" --exclude="node_modules" --exclude=".env" --exclude="dist" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}:/opt/copilote-brochant/"

      - name: Exécuter le script de déploiement sur le serveur
        run: |
          # GOOGLE_CLIENT_ID/SECRET, SITE_AUTH_USER/PASSWORD et
          # ANTHROPIC_API_KEY sont transmis en arguments positionnels (jamais
          # commis dans le depot) : GitHub masque automatiquement ces valeurs
          # dans les journaux car elles proviennent de secrets. SITE_AUTH_*
          # protegent l'acces au site par mot de passe (nginx) ;
          # ANTHROPIC_API_KEY alimente Morgane (assistante IA). Absents,
          # bootstrap.sh laisse la configuration existante inchangee.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}" \
            "sudo bash /opt/copilote-brochant/scripts/deploy/bootstrap.sh '${{ secrets.GOOGLE_CLIENT_ID }}' '${{ secrets.GOOGLE_CLIENT_SECRET }}' '${{ secrets.SITE_AUTH_USER }}' '${{ secrets.SITE_AUTH_PASSWORD }}' '${{ secrets.ANTHROPIC_API_KEY }}'"
