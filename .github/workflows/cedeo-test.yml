name: Test CEDEO (pilote BatiPrix IA)

# Lance une recherche reelle chez CEDEO directement sur le serveur de
# production et affiche le resultat dans les logs de ce run. Evite de
# demander a l'utilisateur de se connecter en SSH pour executer
# scripts/cedeo-test-recherche.ts lui-meme (il n'a pas d'acces serveur) -
# il suffit de declencher ce workflow (depuis l'onglet Actions du depot,
# ou via Claude) avec le produit recherche.
on:
  workflow_dispatch:
    inputs:
      requete:
        description: "Produit a rechercher chez CEDEO (ex. tube multicouche 16)"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configurer la clé SSH de déploiement
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OVH_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.OVH_HOST }}" >> ~/.ssh/known_hosts

      - name: Lancer la recherche CEDEO sur le serveur
        run: |
          # Base64 pour transmettre la requete sans aucun risque lie aux
          # guillemets/apostrophes qu'un nom de produit peut contenir (ex.
          # "tube d'evacuation"), plutot que de l'interpoler telle quelle
          # dans une commande shell a travers deux sauts (local -> ssh ->
          # shell distant).
          REQUETE_B64=$(printf '%s' "${{ inputs.requete }}" | base64 -w0)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}" \
            "cd /opt/copilote-brochant && sudo -u copilote node dist/scripts/cedeo-test-recherche.js \"\$(echo '$REQUETE_B64' | base64 -d)\""
