# Reverse proxy HTTP -> application (port 3000). En attendant un nom de
# domaine (voir docs/mise-en-service.md), sert en HTTP simple sur l'IP du
# serveur. Une fois un domaine disponible, remplacer "server_name _;" par
# le domaine et ajouter le certificat TLS (certbot --nginx -d votre-domaine).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
